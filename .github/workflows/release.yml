name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package source archive
        run: git archive --format=tar.gz --prefix="stdui-$GITHUB_REF_NAME/" -o "stdui-$GITHUB_REF_NAME.tar.gz" "$GITHUB_REF_NAME"

      - name: Package install tree
        run: |
          cmake --install build --prefix stage
          tar -czf "stdui-$GITHUB_REF_NAME-cmake.tar.gz" -C stage .

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            stdui-${{ github.ref_name }}.tar.gz
            stdui-${{ github.ref_name }}-cmake.tar.gz
          generate_release_notes: true
